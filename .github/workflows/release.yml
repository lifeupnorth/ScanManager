name: release

# Push a tag like v0.1.0 (matching <Version> in Directory.Build.props) to build the
# installers and publish them as a GitHub release, with that version's CHANGELOG.md section
# as its What's new. Run it manually to just build them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version)[0]
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in Directory.Build.props."
          }

      - name: Test
        run: dotnet test ScanManager.slnx --configuration Release

      # Code signing switches on when these repository variables/secrets are set; until then
      # they are empty and the installers are built unsigned. See installer/signing.ps1.
      - name: Build installers
        shell: pwsh
        run: ./installer/build.ps1
        env:
          # Azure Artifact Signing (formerly Trusted Signing)
          SIGN_ARTIFACT_ENDPOINT: ${{ vars.SIGN_ARTIFACT_ENDPOINT }}
          SIGN_ARTIFACT_ACCOUNT: ${{ vars.SIGN_ARTIFACT_ACCOUNT }}
          SIGN_ARTIFACT_PROFILE: ${{ vars.SIGN_ARTIFACT_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Or a .pfx certificate, base64-encoded
          SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: artifacts/installers/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem artifacts/installers/*.exe).FullName
          # What's new from CHANGELOG.md and the Installers section (see release-notes.ps1),
          # then GitHub's generated changelog
          $notes = ./.github/release-notes.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -Installers $files
          gh release create $env:GITHUB_REF_NAME @files --title "ScanManager $env:GITHUB_REF_NAME" --notes $notes --generate-notes
