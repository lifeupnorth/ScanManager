name: release

# Push a tag like v0.1.0 (matching <Version> in Directory.Build.props) to build the
# installers and publish them as a GitHub release. Run it manually to just build them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version)[0]
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in Directory.Build.props."
          }

      - name: Test
        run: dotnet test ScanManager.slnx --configuration Release

      - name: Build installers
        shell: pwsh
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: artifacts/installers/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem artifacts/installers/*.exe).FullName
          gh release create $env:GITHUB_REF_NAME @files --title "ScanManager $env:GITHUB_REF_NAME" --generate-notes
